<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">Hi, it's Vivek</title>
  <desc id="desc">A casual animated greeting.</desc>
  <rect width="960" height="180" rx="18" fill="#171717"/>
  <rect x="1" y="1" width="958" height="178" rx="17" fill="none" stroke="#3a3432" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" fill="#f2a65a"
        font-family="Segoe Print, Comic Sans MS, cursive" font-size="58" font-weight="600">
    Hi, it's Vivek
    <animateTransform attributeName="transform" type="translate" values="0 8;0 0" dur="700ms" fill="freeze"/>
  </text>
</svg>
