<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Vivek Anupindi — Computer Science Ph.D. Student</title>
  <desc id="desc">A polished research-console banner about building thoughtful AI and dependable data systems for human health.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101711"/>
      <stop offset=".58" stop-color="#111a12"/>
      <stop offset="1" stop-color="#090f0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="86%" cy="14%" r="72%">
      <stop offset="0" stop-color="#abd301" stop-opacity=".30"/>
      <stop offset="1" stop-color="#abd301" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#abd301"/>
      <stop offset="1" stop-color="#72b58e" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="330" rx="22" fill="url(#grid)"/>
  <rect x="48" y="48" width="6" height="234" rx="3" fill="#abd301"/>
  <text x="82" y="105" fill="#94b609" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="4">VIVEK ANUPINDI  /  RESEARCH PROFILE</text>
  <text x="80" y="177" fill="#f4ece7" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Building thoughtful AI</text>
  <text x="80" y="235" fill="#abd301" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">for human health.</text>
  <path d="M82 263H690" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>
  <text x="82" y="300" fill="#a9b6a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5">COMPUTER SCIENCE  ·  UMBC  ·  CLINICAL NLP  ·  HEALTHCARE AI</text>
  <g transform="translate(865 71)">
    <rect width="285" height="190" rx="14" fill="#0d0c0d" fill-opacity=".78" stroke="#456b4c" stroke-opacity=".85"/>
    <path d="M0 43H285" stroke="#ffffff" stroke-opacity=".10"/>
    <circle cx="22" cy="22" r="6" fill="#abd301"/>
    <circle cx="43" cy="22" r="6" fill="#94b609"/>
    <circle cx="64" cy="22" r="6" fill="#62a883"/>
    <text x="23" y="75" fill="#72b58e" font-family="ui-monospace, monospace" font-size="12">~/research</text>
    <text x="23" y="108" fill="#abd301" font-family="ui-monospace, monospace" font-size="13">$ whoami</text>
    <text x="23" y="132" fill="#e7f0e5" font-family="ui-monospace, monospace" font-size="12">Ph.D. student · UMBC</text>
    <text x="23" y="160" fill="#abd301" font-family="ui-monospace, monospace" font-size="13">$ focus --health</text>
    <rect x="23" y="173" width="8" height="3" fill="#abd301"/>
    <rect x="36" y="173" width="28" height="3" fill="#72b58e" fill-opacity=".65"/>
    <rect x="69" y="173" width="18" height="3" fill="#72b58e" fill-opacity=".35"/>
