<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Vivek Anupindi — GitHub languages and streak</title>
  <desc id="desc">The public language breakdown and contribution streak will appear after the first successful refresh. No counts are estimated.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211818"/><stop offset="1" stop-color="#111112"/></linearGradient></defs>
  <rect width="960" height="300" rx="18" fill="url(#background)"/>
  <rect x=".5" y=".5" width="959" height="299" rx="17.5" fill="none" stroke="#573333"/>
  <text x="28" y="40" fill="#f2e9e4" font-family="Arial,sans-serif" font-size="19" font-weight="700">GitHub snapshot</text>
  <text x="28" y="62" fill="#b7a7a1" font-family="Arial,sans-serif" font-size="11">Public language mix and current activity streak</text>
  <rect x="28" y="88" width="330" height="166" rx="13" fill="#251c1c" stroke="#573333"/>
  <text x="50" y="132" fill="#e5b68b" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">CURRENT STREAK</text>
  <text x="50" y="180" fill="#f2e9e4" font-family="Arial,sans-serif" font-size="17" font-weight="700">Waiting for first live refresh</text>
  <text x="50" y="207" fill="#b7a7a1" font-family="Arial,sans-serif" font-size="11">No totals are filled with sample data.</text>
  <text x="390" y="101" fill="#e5b68b" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">LANGUAGES BY CODE SIZE</text>
  <text x="410" y="156" fill="#b7a7a1" font-family="Arial,sans-serif" font-size="14">Live data will appear after a successful Actions run.</text>
  <text x="28" y="280" fill="#b7a7a1" font-family="Arial,sans-serif" font-size="10">Only publicly visible activity is counted.</text>
</svg>