<svg xmlns="http://www.w3.org/2000/svg" width="960" height="284" viewBox="0 0 960 284" role="img" aria-labelledby="title desc">
  <title id="title">Vivek Anupindi — GitHub public statistics</title>
  <desc id="desc">A locally hosted card. The first live public statistics snapshot is generated by GitHub Actions after this change is merged.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211818"/><stop offset="1" stop-color="#111112"/></linearGradient>
    <radialGradient id="glow" cx="96%" cy="0%" r="70%"><stop offset="0" stop-color="#e50914" stop-opacity=".16"/><stop offset="1" stop-color="#e50914" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="960" height="284" rx="18" fill="url(#background)"/>
  <rect width="960" height="284" rx="18" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="959" height="283" rx="17.5" fill="none" stroke="#573333"/>
  <text x="30" y="43" fill="#f2e9e4" font-family="Arial,sans-serif" font-size="19" font-weight="700">GitHub at a glance</text>
  <text x="30" y="65" fill="#b7a7a1" font-family="Arial,sans-serif" font-size="11">Public profile snapshot · vivekanupindi</text>
  <g transform="translate(30 92)">
    <rect width="900" height="112" rx="13" fill="#251c1c" stroke="#573333"/>
    <rect x="18" y="22" width="4" height="24" rx="2" fill="#e50914"/>
    <text x="36" y="39" fill="#e5b68b" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">AUTOMATIC REFRESH ENABLED</text>
    <text x="18" y="75" fill="#f2e9e4" font-family="Arial,sans-serif" font-size="18" font-weight="700">Your first public stats snapshot is queued.</text>
    <text x="18" y="95" fill="#b7a7a1" font-family="Arial,sans-serif" font-size="11">GitHub Actions generates this card after the stats PR is merged.</text>
  </g>
  <text x="30" y="252" fill="#b7a7a1" font-family="Arial,sans-serif" font-size="10">PUBLIC DATA ONLY</text>
  <text x="930" y="252" text-anchor="end" fill="#b7a7a1" font-family="Arial,sans-serif" font-size="10">Refreshes daily</text>
</svg>
