name: Refresh GitHub profile stats

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-profile-stats.yml"
      - "scripts/refresh_profile_stats.py"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate language and contribution streak card from GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_CONTRIBUTIONS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_USERNAME: vivekanupindi
        run: python scripts/refresh_profile_stats.py

      - name: Commit refreshed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-profile-stats.svg
          if git diff --cached --quiet; then
            echo "Profile stats are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          git push
