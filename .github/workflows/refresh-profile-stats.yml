name: Refresh profile statistics

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-profile-stats.yml"
      - "scripts/refresh_profile_stats.py"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate public GitHub stats cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG cards from GitHub's public API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: vivekanupindi
        run: python scripts/refresh_profile_stats.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-public-stats.svg assets/github-language-breakdown.svg
          if git diff --cached --quiet; then
            echo "Profile statistics are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh public GitHub profile stats"
          git push
